name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.2.4)'
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Version tag (e.g., v0.2.4)'
        required: true
        type: string

permissions:
  contents: write

env:
  GO_VERSION: '1.22'

jobs:
  build-cli:
    name: Build CLI (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: darwin
            arch: arm64
          - os: darwin
            arch: amd64
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Get version info
        id: version
        run: |
          # Use input version if provided (workflow_dispatch/workflow_call), otherwise use tag
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            git checkout "$VERSION"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "commit=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          echo "build_time=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build CLI binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          cd cmd/penf
          go build -ldflags "\
            -X github.com/otherjamesbrown/penfold/pkg/buildinfo.Version=${{ steps.version.outputs.version }} \
            -X github.com/otherjamesbrown/penfold/pkg/buildinfo.Commit=${{ steps.version.outputs.commit }} \
            -X github.com/otherjamesbrown/penfold/pkg/buildinfo.BuildTime=${{ steps.version.outputs.build_time }}" \
            -o penf .

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          # Raw binary for penf update (naming: penf-<os>-<arch>)
          cp cmd/penf/penf dist/penf-${{ matrix.os }}-${{ matrix.arch }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: penf-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/penf-${{ matrix.os }}-${{ matrix.arch }}

  release:
    name: Create Release
    needs: build-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          # Use input version if provided (workflow_dispatch/workflow_call), otherwise use tag
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release assets
        run: |
          mkdir -p release
          # Copy raw binaries (for penf update)
          find dist -name "penf-*" -type f -exec cp {} release/ \;
          # Make binaries executable
          chmod +x release/penf-*
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum penf-* > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          body: |
            ## Installation

            ### Update existing installation (recommended)
            ```bash
            penf update
            ```

            ### Fresh install
            ```bash
            # macOS (Apple Silicon)
            curl -L -o /usr/local/bin/penf https://github.com/otherjamesbrown/penfold/releases/download/${{ steps.version.outputs.version }}/penf-darwin-arm64
            chmod +x /usr/local/bin/penf

            # macOS (Intel)
            curl -L -o /usr/local/bin/penf https://github.com/otherjamesbrown/penfold/releases/download/${{ steps.version.outputs.version }}/penf-darwin-amd64
            chmod +x /usr/local/bin/penf

            # Linux (x86_64)
            curl -L -o /usr/local/bin/penf https://github.com/otherjamesbrown/penfold/releases/download/${{ steps.version.outputs.version }}/penf-linux-amd64
            chmod +x /usr/local/bin/penf

            # Linux (ARM64)
            curl -L -o /usr/local/bin/penf https://github.com/otherjamesbrown/penfold/releases/download/${{ steps.version.outputs.version }}/penf-linux-arm64
            chmod +x /usr/local/bin/penf
            ```

            Then initialize:
            ```bash
            penf init
            ```
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-alpha') || contains(steps.version.outputs.version, '-beta') || contains(steps.version.outputs.version, '-rc') }}
          files: |
            release/penf-*
            release/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
