name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GO_VERSION: '1.22'

jobs:
  build-cli:
    name: Build CLI (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: darwin
            arch: arm64
          - os: darwin
            arch: amd64
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Get version info
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          echo "commit=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          echo "build_time=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build CLI binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          cd cmd/penf
          go build -ldflags "\
            -X main.version=${{ steps.version.outputs.version }} \
            -X main.commit=${{ steps.version.outputs.commit }} \
            -X main.buildTime=${{ steps.version.outputs.build_time }}" \
            -o penf .

      - name: Create archive
        run: |
          mkdir -p dist
          cp cmd/penf/penf dist/
          cp docs/assistant-claude.md dist/CLAUDE.md
          cd dist
          tar -czvf penf_${{ matrix.os }}_${{ matrix.arch }}.tar.gz penf CLAUDE.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: penf_${{ matrix.os }}_${{ matrix.arch }}
          path: dist/penf_${{ matrix.os }}_${{ matrix.arch }}.tar.gz

  release:
    name: Create Release
    needs: build-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release assets
        run: |
          mkdir -p release
          find dist -name "*.tar.gz" -exec cp {} release/ \;
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@v3
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          body: |
            ${{ steps.changelog.outputs.content }}

            ## Installation

            Download the appropriate archive for your platform and extract it:

            ```bash
            # macOS (Apple Silicon)
            curl -L https://github.com/otherjamesbrown/penfold/releases/download/${{ github.ref_name }}/penf_darwin_arm64.tar.gz | tar xz
            sudo mv penf /usr/local/bin/

            # macOS (Intel)
            curl -L https://github.com/otherjamesbrown/penfold/releases/download/${{ github.ref_name }}/penf_darwin_amd64.tar.gz | tar xz
            sudo mv penf /usr/local/bin/

            # Linux (x86_64)
            curl -L https://github.com/otherjamesbrown/penfold/releases/download/${{ github.ref_name }}/penf_linux_amd64.tar.gz | tar xz
            sudo mv penf /usr/local/bin/

            # Linux (ARM64)
            curl -L https://github.com/otherjamesbrown/penfold/releases/download/${{ github.ref_name }}/penf_linux_arm64.tar.gz | tar xz
            sudo mv penf /usr/local/bin/
            ```

            Then initialize penf:
            ```bash
            penf init
            ```
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
          files: |
            release/*.tar.gz
            release/checksums.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
