# Pipeline configuration for penfold
# See: cxp pipeline setup --help

build:
    - cd penfold-go-pipeline && go build ./...
test:
    - cd penfold-go-pipeline && go test ./...
    - cd penfold-go-pipeline && go vet ./...

agents:
    agent-mycroft:
        domains: [backend, services, tests]
    agent-steve:
        domains: [cli, migrations]

dispatch:
    max_concurrent: 3
    tmux_session: dev-penf-cli
    claude_flags: "--dangerously-skip-permissions"
    default_model: sonnet              # fallback if phase/gate doesn't specify

monitoring:
    stall_timeout: 30m
    crash_check: true
    max_retries: 3
    cooldown: 5m
    model: haiku                       # health checks are judgment calls
    actions:
        on_stall: skill:m-stall-check
        on_crash: redispatch
        on_max_retries: escalate

review:
    ci:
        mode: pr-only
        wait: true
    strategy: external
    external_reviewers: [gemini]
    process_skill: m-process-pr-review
    model: haiku                       # evaluating reviews is judgment

# Context layers — what context agents receive per session type
# Layers are assembled in order. "when" controls which mode loads them.
context:
    layers:
        # === Always loaded (both interactive and dispatch) ===
        - name: architecture
          source: file:.cxp/context/architecture.md
          when: always
        - name: deploy
          source: file:.cxp/context/deploy.md
          when: always

        # === Interactive sessions (James typing) ===
        - name: agent-identity
          source: file:.cxp/context/agent-identity.md
          when: interactive
        - name: completion-protocol
          source: file:.cxp/context/completion-protocol.md
          when: interactive
        - name: playbook
          source: shard:pf-2b76b4
          when: interactive
        - name: menu-instructions
          source: file:.cxp/context/interactive-menu.md
          when: interactive

        # === Pipeline-dispatched agents ===
        - name: task-prompt
          source: dispatch-prompt
          when: dispatch
        - name: design-context
          source: parent-design
          when: dispatch
        - name: dispatch-completion
          source: file:.cxp/context/dispatch-completion.md
          when: dispatch

github:
    owner_repo: otherjamesbrown/penfold

skills_dir: skills

# Pipeline phases — model set per phase and overridable per gate
phases:
    - name: design
      model: haiku                     # readiness checks are judgment
      gates:
          - name: readiness-review
            skill: m-readiness-check
            model: haiku
            fields:
                readiness: {type: int, min: 1, max: 5, required: true}

    - name: decompose
      model: sonnet                    # task breakdown needs architecture understanding
      gates:
          - name: decomposition-review
            skill: m-decomposition-review
            model: haiku               # reviewing decomposition is judgment
            requires_label: integration-test

    - name: implement
      model: sonnet                    # code writing

    - name: review
      model: haiku                     # code review is judgment

    - name: done
      gates:
          - name: retrospective
            skill: m-retrospective
            model: haiku               # reviewing patterns is judgment
