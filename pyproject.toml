# Penfold Project Configuration
# ==============================
# NOTE: Python code has been migrated to Go. This file is kept for reference
# and for any remaining Python tooling (like the MLX embeddings sidecar).
#
# Main application: cmd/penf (Go CLI)
# Services: services/ (Go gRPC services)
# Sidecar: penfold-go-pipeline/sidecar/ (Python MLX embeddings)

[project]
name = "penfold"
version = "0.1.0"
description = "Personal AI-powered contextual information system (migrated to Go)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    {name = "James Brown"},
]

# Minimal dependencies for any remaining Python scripts
dependencies = []

[project.urls]
Homepage = "https://github.com/otherjamesbrown/penfold"
Repository = "https://github.com/otherjamesbrown/penfold.git"
Documentation = "https://github.com/otherjamesbrown/penfold/tree/main/specs"

# Tool configuration for any Python code linting
[tool.ruff]
target-version = "py312"
line-length = 88
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.black]
target-version = ["py312"]
line-length = 88
