[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "penfold"
version = "0.1.0"
description = "Personal AI-powered contextual information system"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    {name = "James Brown"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Database and ORM
    "sqlalchemy[asyncio] >= 2.0.0",
    "asyncpg >= 0.29.0",
    "alembic >= 1.13.0",
    "pgvector >= 0.2.5",

    # Event processing
    "redis >= 5.0.0",
    "msgpack >= 1.0.7",

    # CLI
    "click >= 8.1.7",
    "rich >= 13.7.0",

    # Utilities
    "pydantic >= 2.5.0",
    "python-dotenv >= 1.0.0",

    # Search
    "dateparser >= 1.2.0",

    # Graph analysis
    "networkx >= 3.2",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest >= 7.4.0",
    "pytest-asyncio >= 0.21.0",
    "pytest-cov >= 4.1.0",

    # Linting and formatting
    "ruff >= 0.1.6",
    "mypy >= 1.7.0",
    "black >= 23.11.0",

    # Development utilities
    "ipython >= 8.17.0",
    "pre-commit >= 3.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["penf_lib"]

# CLI removed - now using Go CLI (cmd/penf)
# [project.scripts]
# penf = "penf_lib.cli:main"

[project.urls]
Homepage = "https://github.com/otherjamesbrown/penfold"
Repository = "https://github.com/otherjamesbrown/penfold.git"
Documentation = "https://github.com/otherjamesbrown/penfold/tree/main/specs"

# Tool configuration
[tool.ruff]
target-version = "py312"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex (will be addressed in refactoring)
    "UP017",  # datetime.UTC alias - using timezone.utc for broader compatibility
]

[tool.ruff.per-file-ignores]
"tests/**/*" = ["S101"]  # Allow assert in tests

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "pgvector.*",
    "msgpack.*",
]
ignore_missing_imports = true

[tool.black]
target-version = ["py312"]
line-length = 88

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "contract: marks tests as contract tests",
]

[tool.coverage.run]
source = ["penf_lib"]
omit = [
    "*/tests/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]