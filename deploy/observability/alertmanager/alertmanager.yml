global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'penfold'
  routes:
    - match:
        severity: critical
      receiver: 'penfold-critical'
      continue: true

receivers:
  - name: 'penfold'
    webhook_configs:
      - url: http://host.docker.internal:9095
        send_resolved: true

  - name: 'penfold-critical'
    webhook_configs:
      - url: http://host.docker.internal:9095
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']
