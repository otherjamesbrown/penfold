openapi: 3.1.0
info:
  title: Penfold Search API
  version: 1.0.0
  description: |
    Search and Query Interface for Penfold.
    Provides unified search across emails, meetings, documents, and other content types.

servers:
  - url: /api/v1
    description: Internal API (CLI library interface)

tags:
  - name: search
    description: Search operations
  - name: sessions
    description: Search session management
  - name: suggestions
    description: Query suggestions and autocomplete

paths:
  /search:
    post:
      operationId: search
      tags:
        - search
      summary: Execute a search query
      description: |
        Perform a unified search across all indexed content using natural language queries.
        Supports temporal constraints, content type filtering, and relationship discovery.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchQuery'
            examples:
              natural_language:
                summary: Natural language query
                value:
                  query_text: "customer deployment issues"
                  limit: 25
              temporal_query:
                summary: Query with temporal constraint
                value:
                  query_text: "Atlas project decisions"
                  temporal:
                    relative_expression: "since December"
                  content_types: ["email", "meeting"]
              filtered_query:
                summary: Query with filters
                value:
                  query_text: "budget discussions"
                  participants: ["john@company.com", "jane@company.com"]
                  projects: ["Q1 Planning"]
                  min_confidence: 0.7
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '408':
          description: Search timeout (exceeded 15 seconds)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /search/related/{entity_type}/{entity_id}:
    get:
      operationId: findRelatedContent
      tags:
        - search
      summary: Find content related to a specific entity
      description: |
        Discover content related to a given entity through participant overlap,
        project references, temporal proximity, and semantic similarity.
      parameters:
        - name: entity_type
          in: path
          required: true
          schema:
            type: string
            enum: [source, assertion, person, project]
        - name: entity_id
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: Related content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelatedContentResponse'
        '404':
          description: Entity not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /search/timeline:
    post:
      operationId: timelineSearch
      tags:
        - search
      summary: Reconstruct a timeline for a topic
      description: |
        Build a chronological view of how a topic evolved over time,
        showing the progression of discussions, decisions, and outcomes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimelineQuery'
      responses:
        '200':
          description: Timeline reconstruction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineResponse'

  /sessions:
    post:
      operationId: createSession
      tags:
        - sessions
      summary: Create a new search session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchSession'

  /sessions/{session_id}:
    get:
      operationId: getSession
      tags:
        - sessions
      summary: Get session details and history
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchSessionDetail'
        '404':
          description: Session not found

    delete:
      operationId: closeSession
      tags:
        - sessions
      summary: Close a search session
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Session closed

  /sessions/{session_id}/history:
    get:
      operationId: getSessionHistory
      tags:
        - sessions
      summary: Get search history for a session
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Search history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SearchQueryRecord'

  /suggestions:
    get:
      operationId: getSuggestions
      tags:
        - suggestions
      summary: Get query suggestions for autocomplete
      parameters:
        - name: prefix
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 20
      responses:
        '200':
          description: Query suggestions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestionsResponse'

  /suggestions/popular:
    get:
      operationId: getPopularQueries
      tags:
        - suggestions
      summary: Get popular search queries
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: time_range
          in: query
          schema:
            type: string
            enum: [day, week, month]
            default: week
      responses:
        '200':
          description: Popular queries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PopularQueriesResponse'

components:
  schemas:
    SearchQuery:
      type: object
      required:
        - query_text
      properties:
        query_text:
          type: string
          minLength: 1
          maxLength: 500
          description: Natural language search query
        content_types:
          type: array
          items:
            type: string
            enum: [email, meeting, document, slack, all]
          default: [all]
          description: Filter by content types
        temporal:
          $ref: '#/components/schemas/TemporalConstraint'
        participants:
          type: array
          items:
            type: string
          maxItems: 20
          description: Filter by participant email addresses
        projects:
          type: array
          items:
            type: string
          maxItems: 10
          description: Filter by project names
        min_confidence:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          description: Minimum AI confidence score
        include_relationships:
          type: boolean
          default: true
          description: Include related content in results
        sort_by:
          type: string
          enum: [relevance, recency, alphabetical]
          default: relevance
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        offset:
          type: integer
          minimum: 0
          default: 0

    TemporalConstraint:
      type: object
      description: Temporal filtering for queries
      properties:
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        relative_expression:
          type: string
          description: Natural language temporal expression (e.g., "last week", "since December")

    SearchResponse:
      type: object
      required:
        - metadata
        - results
      properties:
        metadata:
          $ref: '#/components/schemas/SearchMetadata'
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
        suggestions:
          type: array
          items:
            type: string
          description: Query refinement suggestions
        filters_applied:
          type: object
          additionalProperties: true
        has_more:
          type: boolean
        next_offset:
          type: integer

    SearchMetadata:
      type: object
      required:
        - query_id
        - execution_time_ms
        - total_results
        - returned_results
      properties:
        query_id:
          type: string
          format: uuid
        execution_time_ms:
          type: integer
        total_results:
          type: integer
        returned_results:
          type: integer
        search_strategy:
          type: string
          enum: [hybrid, full_text, semantic]
        cache_hit:
          type: boolean

    SearchResult:
      type: object
      required:
        - result_id
        - entity_type
        - entity_id
        - content_type
        - preview
        - relevance_score
        - timestamp
      properties:
        result_id:
          type: string
          format: uuid
        entity_type:
          type: string
          enum: [source, assertion, person, project]
        entity_id:
          type: integer
        content_type:
          type: string
          enum: [email, meeting, document, slack]
        preview:
          $ref: '#/components/schemas/ContentPreview'
        source_attribution:
          type: string
          description: Link or reference to original content
        relevance_score:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
        rrf_score:
          type: number
          format: float
          description: Reciprocal rank fusion score
        confidence_score:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
          description: AI processing confidence
        timestamp:
          type: string
          format: date-time
        participants:
          type: array
          items:
            type: string
        project_refs:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        related_content_ids:
          type: array
          items:
            type: string
        relationship_strength:
          type: number
          format: float

    ContentPreview:
      type: object
      required:
        - snippet
      properties:
        title:
          type: string
        snippet:
          type: string
          maxLength: 500
        highlight_positions:
          type: array
          items:
            type: array
            items:
              type: integer
            minItems: 2
            maxItems: 2
          description: Array of [start, end] positions for highlighting

    TimelineQuery:
      type: object
      required:
        - topic
      properties:
        topic:
          type: string
          description: Topic to trace through time
        start_date:
          type: string
          format: date-time
        end_date:
          type: string
          format: date-time
        granularity:
          type: string
          enum: [day, week, month]
          default: week

    TimelineResponse:
      type: object
      required:
        - topic
        - timeline_entries
      properties:
        topic:
          type: string
        timeline_entries:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEntry'
        summary:
          type: string
          description: AI-generated summary of topic evolution

    TimelineEntry:
      type: object
      required:
        - date
        - content
      properties:
        date:
          type: string
          format: date-time
        content:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'
        evolution_note:
          type: string
          description: How the topic changed at this point

    RelatedContentResponse:
      type: object
      required:
        - entity_type
        - entity_id
        - related_content
      properties:
        entity_type:
          type: string
        entity_id:
          type: integer
        related_content:
          type: array
          items:
            $ref: '#/components/schemas/RelatedItem'

    RelatedItem:
      type: object
      required:
        - result
        - relationship_type
        - strength
      properties:
        result:
          $ref: '#/components/schemas/SearchResult'
        relationship_type:
          type: string
          enum: [participant, project, temporal, semantic, thread]
        strength:
          type: number
          format: float

    CreateSessionRequest:
      type: object
      required:
        - user_email
      properties:
        user_email:
          type: string
          format: email
        context:
          type: object
          additionalProperties: true

    SearchSession:
      type: object
      required:
        - session_id
        - user_email
        - is_active
      properties:
        session_id:
          type: string
        user_email:
          type: string
        is_active:
          type: boolean
        started_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    SearchSessionDetail:
      allOf:
        - $ref: '#/components/schemas/SearchSession'
        - type: object
          properties:
            total_queries:
              type: integer
            successful_searches:
              type: integer
            recent_queries:
              type: array
              items:
                $ref: '#/components/schemas/SearchQueryRecord'

    SearchQueryRecord:
      type: object
      properties:
        query_text:
          type: string
        filters:
          type: object
        execution_time_ms:
          type: integer
        result_count:
          type: integer
        created_at:
          type: string
          format: date-time

    SuggestionsResponse:
      type: object
      required:
        - suggestions
      properties:
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/Suggestion'

    Suggestion:
      type: object
      required:
        - text
        - type
      properties:
        text:
          type: string
        type:
          type: string
          enum: [popular, recent, contextual]
        frequency:
          type: integer
        success_rate:
          type: number
          format: float

    PopularQueriesResponse:
      type: object
      required:
        - time_range
        - queries
      properties:
        time_range:
          type: string
        queries:
          type: array
          items:
            type: object
            properties:
              query_text:
                type: string
              count:
                type: integer
              avg_results:
                type: number

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
