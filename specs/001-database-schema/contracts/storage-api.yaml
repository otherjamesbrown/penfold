openapi: 3.0.3
info:
  title: Database Storage Layer API
  description: Core database operations for Penfold's storage layer
  version: 1.0.0
  contact:
    name: Penfold Database Team

servers:
  - url: http://localhost:8000/api/v1
    description: Local development server

paths:
  /sources:
    get:
      summary: Retrieve sources
      description: Get sources with filtering and pagination support
      parameters:
        - name: source_system
          in: query
          schema:
            type: string
            enum: [gmail, slack, meetings, documents]
        - name: processing_status
          in: query
          schema:
            type: string
            enum: [pending, processing, completed, failed]
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 50
      responses:
        '200':
          description: Sources retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcesResponse'

    post:
      summary: Create new source
      description: Ingest new source content into the system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSourceRequest'
      responses:
        '201':
          description: Source created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '409':
          description: Source already exists (duplicate external_id)

  /sources/{source_id}:
    get:
      summary: Get source by ID
      parameters:
        - name: source_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Source retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '404':
          description: Source not found

    put:
      summary: Update source
      parameters:
        - name: source_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSourceRequest'
      responses:
        '200':
          description: Source updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'

    delete:
      summary: Soft delete source
      parameters:
        - name: source_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Source soft deleted successfully

  /assertions:
    get:
      summary: Retrieve assertions
      parameters:
        - name: assertion_type
          in: query
          schema:
            type: string
            enum: [decision, commitment, risk, milestone, question, action_item, deadline, dependency]
        - name: min_confidence
          in: query
          schema:
            type: number
            minimum: 0.0
            maximum: 1.0
        - name: source_id
          in: query
          schema:
            type: integer
            format: int64
        - name: user_validated
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Assertions retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssertionsResponse'

    post:
      summary: Create new assertion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssertionRequest'
      responses:
        '201':
          description: Assertion created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assertion'

  /assertions/{assertion_id}/validate:
    post:
      summary: Validate assertion
      description: User validation and feedback on AI-extracted assertions
      parameters:
        - name: assertion_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationRequest'
      responses:
        '200':
          description: Assertion validated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Assertion'

  /people:
    get:
      summary: Retrieve people
      parameters:
        - name: name_search
          in: query
          description: Search by canonical name or aliases
          schema:
            type: string
        - name: organization
          in: query
          schema:
            type: string
      responses:
        '200':
          description: People retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeopleResponse'

    post:
      summary: Create new person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePersonRequest'
      responses:
        '201':
          description: Person created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'

  /people/{person_id}/merge:
    post:
      summary: Merge duplicate people
      description: Merge two person records and update all references
      parameters:
        - name: person_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergePersonRequest'
      responses:
        '200':
          description: People merged successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'

  /embeddings/search:
    post:
      summary: Vector similarity search
      description: Find similar content using vector embeddings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VectorSearchRequest'
      responses:
        '200':
          description: Similar content found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VectorSearchResponse'

  /embeddings:
    post:
      summary: Store embedding
      description: Store vector embedding for content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmbeddingRequest'
      responses:
        '201':
          description: Embedding stored successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Embedding'

  /events:
    post:
      summary: Publish processing event
      description: Publish event for AI processing pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishEventRequest'
      responses:
        '202':
          description: Event published successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingEvent'

  /jobs:
    get:
      summary: Retrieve processing jobs
      parameters:
        - name: processor_id
          in: query
          schema:
            type: string
        - name: job_status
          in: query
          schema:
            type: string
            enum: [queued, in_progress, completed, failed, timeout]
        - name: event_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Processing jobs retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingJobsResponse'

  /jobs/{job_id}/status:
    put:
      summary: Update job status
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJobStatusRequest'
      responses:
        '200':
          description: Job status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingJob'

components:
  schemas:
    Source:
      type: object
      required:
        - id
        - tenant_id
        - source_system
        - external_id
        - content_hash
        - created_at
      properties:
        id:
          type: integer
          format: int64
        tenant_id:
          type: string
          format: uuid
        source_system:
          type: string
          enum: [gmail, slack, meetings, documents]
        external_id:
          type: string
        content_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        raw_content:
          type: string
        content_type:
          type: string
        content_size:
          type: integer
        ingestion_metadata:
          type: object
          additionalProperties: true
        processing_status:
          type: string
          enum: [pending, processing, completed, failed]
        source_timestamp:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateSourceRequest:
      type: object
      required:
        - source_system
        - external_id
        - content_hash
      properties:
        source_system:
          type: string
          enum: [gmail, slack, meetings, documents]
        external_id:
          type: string
        content_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        raw_content:
          type: string
        content_type:
          type: string
        ingestion_metadata:
          type: object
          additionalProperties: true
        source_timestamp:
          type: string
          format: date-time

    UpdateSourceRequest:
      type: object
      properties:
        raw_content:
          type: string
        processing_status:
          type: string
          enum: [pending, processing, completed, failed]
        ingestion_metadata:
          type: object
          additionalProperties: true

    SourcesResponse:
      type: object
      required:
        - sources
        - total
        - page
        - limit
      properties:
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    Assertion:
      type: object
      required:
        - id
        - tenant_id
        - source_id
        - assertion_type
        - content
        - created_at
      properties:
        id:
          type: integer
          format: int64
        tenant_id:
          type: string
          format: uuid
        source_id:
          type: integer
          format: int64
        assertion_type:
          type: string
          enum: [decision, commitment, risk, milestone, question, action_item, deadline, dependency]
        content:
          type: string
        context:
          type: string
        confidence_score:
          type: number
          minimum: 0.0
          maximum: 1.0
        extraction_model:
          type: string
        processing_metadata:
          type: object
          additionalProperties: true
        related_entities:
          type: object
          additionalProperties: true
        tags:
          type: array
          items:
            type: string
        user_validated:
          type: boolean
        validation_feedback:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateAssertionRequest:
      type: object
      required:
        - source_id
        - assertion_type
        - content
      properties:
        source_id:
          type: integer
          format: int64
        assertion_type:
          type: string
          enum: [decision, commitment, risk, milestone, question, action_item, deadline, dependency]
        content:
          type: string
        context:
          type: string
        confidence_score:
          type: number
          minimum: 0.0
          maximum: 1.0
        extraction_model:
          type: string
        processing_metadata:
          type: object
          additionalProperties: true
        related_entities:
          type: object
          additionalProperties: true
        tags:
          type: array
          items:
            type: string

    ValidationRequest:
      type: object
      required:
        - validated
      properties:
        validated:
          type: boolean
        feedback:
          type: object
          additionalProperties: true
        corrected_content:
          type: string
        corrected_type:
          type: string
          enum: [decision, commitment, risk, milestone, question, action_item, deadline, dependency]

    AssertionsResponse:
      type: object
      required:
        - assertions
        - total
        - page
        - limit
      properties:
        assertions:
          type: array
          items:
            $ref: '#/components/schemas/Assertion'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    Person:
      type: object
      required:
        - id
        - tenant_id
        - canonical_name
        - created_at
      properties:
        id:
          type: integer
          format: int64
        tenant_id:
          type: string
          format: uuid
        canonical_name:
          type: string
        display_name:
          type: string
        contact_methods:
          type: object
          additionalProperties: true
        aliases:
          type: array
          items:
            type: string
        organization:
          type: string
        job_title:
          type: string
        department:
          type: string
        confidence_score:
          type: number
          minimum: 0.0
          maximum: 1.0
        resolution_metadata:
          type: object
          additionalProperties: true
        manual_override:
          type: boolean
        last_seen_at:
          type: string
          format: date-time
        interaction_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreatePersonRequest:
      type: object
      required:
        - canonical_name
      properties:
        canonical_name:
          type: string
        display_name:
          type: string
        contact_methods:
          type: object
          additionalProperties: true
        aliases:
          type: array
          items:
            type: string
        organization:
          type: string
        job_title:
          type: string
        department:
          type: string
        confidence_score:
          type: number
          minimum: 0.0
          maximum: 1.0
        resolution_metadata:
          type: object
          additionalProperties: true

    MergePersonRequest:
      type: object
      required:
        - merge_with_person_id
      properties:
        merge_with_person_id:
          type: integer
          format: int64
        keep_canonical_name:
          type: string
        merge_contact_methods:
          type: boolean
          default: true
        merge_aliases:
          type: boolean
          default: true

    PeopleResponse:
      type: object
      required:
        - people
        - total
        - page
        - limit
      properties:
        people:
          type: array
          items:
            $ref: '#/components/schemas/Person'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    Embedding:
      type: object
      required:
        - id
        - tenant_id
        - entity_type
        - entity_id
        - embedding_model
        - created_at
      properties:
        id:
          type: integer
          format: int64
        tenant_id:
          type: string
          format: uuid
        source_id:
          type: integer
          format: int64
        assertion_id:
          type: integer
          format: int64
        entity_type:
          type: string
          enum: [source, assertion, person, project]
        entity_id:
          type: integer
          format: int64
        embedding_model:
          type: string
        model_version:
          type: string
        text_content:
          type: string
        content_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        generation_confidence:
          type: number
          minimum: 0.0
          maximum: 1.0
        generation_metadata:
          type: object
          additionalProperties: true
        search_count:
          type: integer
        last_searched_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateEmbeddingRequest:
      type: object
      required:
        - entity_type
        - entity_id
        - embedding
        - embedding_model
        - text_content
      properties:
        source_id:
          type: integer
          format: int64
        assertion_id:
          type: integer
          format: int64
        entity_type:
          type: string
          enum: [source, assertion, person, project]
        entity_id:
          type: integer
          format: int64
        embedding:
          type: array
          items:
            type: number
          minItems: 768
          maxItems: 768
        embedding_model:
          type: string
        model_version:
          type: string
        text_content:
          type: string
        generation_confidence:
          type: number
          minimum: 0.0
          maximum: 1.0
        generation_metadata:
          type: object
          additionalProperties: true

    VectorSearchRequest:
      type: object
      required:
        - query_vector
      properties:
        query_vector:
          type: array
          items:
            type: number
          minItems: 768
          maxItems: 768
        entity_types:
          type: array
          items:
            type: string
            enum: [source, assertion, person, project]
        min_similarity:
          type: number
          minimum: 0.0
          maximum: 1.0
          default: 0.7
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
        exclude_entity_ids:
          type: array
          items:
            type: integer
            format: int64

    VectorSearchResponse:
      type: object
      required:
        - results
        - total
        - search_time_ms
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/VectorSearchResult'
        total:
          type: integer
        search_time_ms:
          type: integer

    VectorSearchResult:
      type: object
      required:
        - embedding
        - similarity_score
        - entity
      properties:
        embedding:
          $ref: '#/components/schemas/Embedding'
        similarity_score:
          type: number
          minimum: 0.0
          maximum: 1.0
        entity:
          oneOf:
            - $ref: '#/components/schemas/Source'
            - $ref: '#/components/schemas/Assertion'
            - $ref: '#/components/schemas/Person'

    ProcessingEvent:
      type: object
      required:
        - id
        - tenant_id
        - event_type
        - event_id
        - payload
        - published_at
      properties:
        id:
          type: integer
          format: int64
        tenant_id:
          type: string
          format: uuid
        event_type:
          type: string
        event_id:
          type: string
          format: uuid
        payload:
          type: object
          additionalProperties: true
        payload_size:
          type: integer
        source_id:
          type: integer
          format: int64
        correlation_id:
          type: string
          format: uuid
        publisher:
          type: string
        subscriber_count:
          type: integer
        retry_count:
          type: integer
        processing_status:
          type: string
          enum: [published, processing, completed, failed]
        error_message:
          type: string
        published_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    PublishEventRequest:
      type: object
      required:
        - event_type
        - payload
      properties:
        event_type:
          type: string
        payload:
          type: object
          additionalProperties: true
        source_id:
          type: integer
          format: int64
        correlation_id:
          type: string
          format: uuid
        publisher:
          type: string

    ProcessingJob:
      type: object
      required:
        - id
        - tenant_id
        - event_id
        - job_id
        - processor_id
        - job_status
        - created_at
      properties:
        id:
          type: integer
          format: int64
        tenant_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        job_id:
          type: string
          format: uuid
        processor_id:
          type: string
        processor_version:
          type: string
        job_config:
          type: object
          additionalProperties: true
        input_data:
          type: object
          additionalProperties: true
        job_status:
          type: string
          enum: [queued, in_progress, completed, failed, timeout]
        retry_count:
          type: integer
        max_retries:
          type: integer
        priority:
          type: integer
          minimum: 1
          maximum: 10
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        execution_time_ms:
          type: integer
        error_code:
          type: string
        error_message:
          type: string
        error_metadata:
          type: object
          additionalProperties: true
        memory_usage_mb:
          type: integer
        cpu_time_ms:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    UpdateJobStatusRequest:
      type: object
      required:
        - job_status
      properties:
        job_status:
          type: string
          enum: [queued, in_progress, completed, failed, timeout]
        error_code:
          type: string
        error_message:
          type: string
        error_metadata:
          type: object
          additionalProperties: true
        memory_usage_mb:
          type: integer
        cpu_time_ms:
          type: integer

    ProcessingJobsResponse:
      type: object
      required:
        - jobs
        - total
        - page
        - limit
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/ProcessingJob'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - BearerAuth: []