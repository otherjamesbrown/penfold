openapi: 3.1.0
info:
  title: Relationship Discovery and Management API
  version: 1.0.0
  description: |
    Internal API contracts for the Relationship Discovery and Management feature.
    These contracts define the interface between the relationship module and other Penfold components.

paths:
  /relationships:
    get:
      operationId: listRelationships
      summary: List relationships with filtering
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: entity_type
          in: query
          schema:
            type: string
            enum: [person, project, topic]
        - name: entity_id
          in: query
          schema:
            type: integer
        - name: relationship_type
          in: query
          schema:
            type: string
        - name: lifecycle_state
          in: query
          schema:
            type: string
            enum: [pending, active, historical, archived]
        - name: min_confidence
          in: query
          schema:
            type: number
            minimum: 0
            maximum: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: List of relationships
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipListResponse'

    post:
      operationId: createRelationship
      summary: Create a new relationship (internal use)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationshipCreate'
      responses:
        '201':
          description: Relationship created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationship'
        '409':
          description: Relationship already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /relationships/{relationship_id}:
    get:
      operationId: getRelationship
      summary: Get relationship details
      parameters:
        - name: relationship_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Relationship details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelationshipDetail'
        '404':
          description: Relationship not found

    patch:
      operationId: updateRelationship
      summary: Update relationship properties
      parameters:
        - name: relationship_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelationshipUpdate'
      responses:
        '200':
          description: Relationship updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Relationship'

  /relationships/{relationship_id}/feedback:
    post:
      operationId: submitFeedback
      summary: Submit user feedback for a relationship
      parameters:
        - name: relationship_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackCreate'
      responses:
        '201':
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feedback'

  /relationships/{relationship_id}/evidence:
    get:
      operationId: getEvidence
      summary: Get evidence for a relationship
      parameters:
        - name: relationship_id
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceListResponse'

  /relationships/conflicts:
    get:
      operationId: listConflicts
      summary: List pending conflicts
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, auto_resolved, user_resolved, deferred]
            default: pending
      responses:
        '200':
          description: List of conflicts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictListResponse'

  /relationships/conflicts/{conflict_id}/resolve:
    post:
      operationId: resolveConflict
      summary: Resolve a conflict
      parameters:
        - name: conflict_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConflictResolution'
      responses:
        '200':
          description: Conflict resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'

components:
  schemas:
    EntityType:
      type: string
      enum: [person, project, topic]

    LifecycleState:
      type: string
      enum: [pending, active, historical, archived]

    FeedbackType:
      type: string
      enum: [confirm, reject, modify]

    RelationshipCreate:
      type: object
      required:
        - source_entity_type
        - source_entity_id
        - target_entity_type
        - target_entity_id
        - relationship_type
        - ai_confidence
      properties:
        source_entity_type:
          $ref: '#/components/schemas/EntityType'
        source_entity_id:
          type: integer
        target_entity_type:
          $ref: '#/components/schemas/EntityType'
        target_entity_id:
          type: integer
        relationship_type:
          type: string
          maxLength: 100
        relationship_subtype:
          type: string
          maxLength: 100
        ai_confidence:
          type: number
          minimum: 0
          maximum: 1
        evidence_content:
          type: string
        evidence_source_id:
          type: integer

    RelationshipUpdate:
      type: object
      properties:
        relationship_type:
          type: string
        relationship_subtype:
          type: string
        lifecycle_state:
          $ref: '#/components/schemas/LifecycleState'

    Relationship:
      type: object
      properties:
        id:
          type: integer
        source_entity_type:
          $ref: '#/components/schemas/EntityType'
        source_entity_id:
          type: integer
        target_entity_type:
          $ref: '#/components/schemas/EntityType'
        target_entity_id:
          type: integer
        relationship_type:
          type: string
        relationship_subtype:
          type: string
        confidence_score:
          type: number
        lifecycle_state:
          $ref: '#/components/schemas/LifecycleState'
        interaction_count:
          type: integer
        user_confirmed:
          type: boolean
        first_observed_at:
          type: string
          format: date-time
        last_evidence_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RelationshipDetail:
      allOf:
        - $ref: '#/components/schemas/Relationship'
        - type: object
          properties:
            ai_confidence:
              type: number
            evidence_strength:
              type: number
            recent_evidence:
              type: array
              items:
                $ref: '#/components/schemas/Evidence'
            feedback_history:
              type: array
              items:
                $ref: '#/components/schemas/Feedback'

    RelationshipListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Relationship'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    Evidence:
      type: object
      properties:
        id:
          type: integer
        evidence_type:
          type: string
          enum: [email, meeting, mention, inference, user_input]
        evidence_content:
          type: string
        strength_contribution:
          type: number
        observed_at:
          type: string
          format: date-time
        source_id:
          type: integer

    EvidenceListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
        total:
          type: integer

    FeedbackCreate:
      type: object
      required:
        - feedback_type
        - user_email
      properties:
        feedback_type:
          $ref: '#/components/schemas/FeedbackType'
        corrected_type:
          type: string
        reasoning:
          type: string
        user_email:
          type: string
          format: email

    Feedback:
      type: object
      properties:
        id:
          type: integer
        relationship_id:
          type: integer
        feedback_type:
          $ref: '#/components/schemas/FeedbackType'
        original_type:
          type: string
        corrected_type:
          type: string
        reasoning:
          type: string
        user_email:
          type: string
        created_at:
          type: string
          format: date-time

    Conflict:
      type: object
      properties:
        id:
          type: integer
        relationship_id:
          type: integer
        conflicting_relationship_id:
          type: integer
        conflict_type:
          type: string
          enum: [type_mismatch, duplicate, contradictory, circular]
        primary_confidence:
          type: number
        secondary_confidence:
          type: number
        confidence_gap:
          type: number
        auto_resolvable:
          type: boolean
        resolution_status:
          type: string
          enum: [pending, auto_resolved, user_resolved, deferred]
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time

    ConflictListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Conflict'
        total:
          type: integer

    ConflictResolution:
      type: object
      required:
        - resolution_action
        - user_email
      properties:
        resolution_action:
          type: string
          enum: [keep_primary, keep_secondary, merge, defer]
        user_email:
          type: string
          format: email
        reasoning:
          type: string

    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
