email: "012-low-priority-fyi.eml"
description: >
  Negative test. Lunch invitation from Jennifer Lee. Should be classified
  as LOW importance with minimal or no assertions extracted. Guards against
  false positive risks, decisions, or action items from casual content.

last_verified: "2026-02-14"
model_at_verification: "gemini-2.0-flash"

pipeline:
  must_complete: [embed]

triage:
  importance:
    one_of: [LOW, NONE]
  category:
    one_of: [SOCIAL, FYI, LOW_PRIORITY, PERSONAL, OTHER]

assertions:
  max_count: 1
  must_not_find:
    - type: risk
    - type: decision
    - type: action
      description_contains: "security"
    - type: issue
      description_contains: "incident"
