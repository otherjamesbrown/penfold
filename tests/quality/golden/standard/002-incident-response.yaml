email: emails/002-incident-response.eml
description: "P0 incident report — API Gateway degradation, 15% 5xx, DRI Rob Taylor"
last_verified: "2026-03-27"
category: standard

routing:
  content_subtype: HUMAN
  pipeline: standard
  must_complete: [parse, triage, extract_ner, extract_semantic, embed]

triage:
  importance:
    one_of: [HIGH, CRITICAL]
  category:
    one_of: [RISK_ISSUE, INCIDENT, OPERATIONAL]

people:
  min_count: 2
  must_find:
    - name_contains: "Daniel"
    - name_contains: "Rob"
  must_not_find:
    - name_contains: "Acme Corp"

assertions:
  min_count: 2
  must_find:
    - type: risk
      description_contains: "API"
    - type: action
      description_contains: "incident"

intent:
  description: "Active P0 incident — requires immediate attention, war room coordination."
  value: high
