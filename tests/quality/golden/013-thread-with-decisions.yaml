email: "013-thread-with-decisions.eml"
description: >
  Reply from John Smith (VP Engineering) to Sarah Chen's risk escalation.
  4 labeled decisions: scope reduction, resource reallocation, revised timeline,
  weekly executive updates. Thread context via In-Reply-To header.
  Cross-project references (Project Alpha, API v3, Portal Redesign).

last_verified: "2026-02-14"
model_at_verification: "gemini-2.0-flash"

pipeline:
  must_complete: [embed, extract_ner, extract_semantic]

triage:
  importance:
    one_of: [HIGH, CRITICAL]
  category:
    one_of: [PROJECT_UPDATE, DECISION, RISK_ISSUE]

people:
  min_count: 4
  must_find:
    - name_contains: "John Smith"
      # NOTE: role_contains:"VP" omitted — pipeline does not populate job_title
    - name_contains: "Sarah Chen"
    - name_contains: "Lisa"
    - name_contains: "David"
  must_not_find:
    - name_contains: "Acme Corp"

assertions:
  min_count: 3
  must_find:
    - type: decision
      description_contains: "Portal Redesign"
    - type: decision
      description_contains: "reassign"
    - type: decision
      description_contains: "MVP target"
  must_not_find:
    - type: security_incident

# NOTE: projects.must_find omitted — pipeline does not set assertions.project_id FK
