version: '3.8'

# Temporal Server for Penfold AI Processing Pipeline
# Start with: docker-compose -f docker-compose.temporal.yml up -d
# UI available at: http://localhost:8088

services:
  temporal:
    image: temporalio/auto-setup:1.24
    ports:
      - "7233:7233"   # gRPC API
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=penfold
      - POSTGRES_PWD=${DB_PASSWORD}
      - POSTGRES_SEEDS=10.0.10.253
      - DYNAMIC_CONFIG_FILE_PATH=/etc/temporal/dynamic_config.yaml
    volumes:
      - ./temporal-config/dynamic_config.yaml:/etc/temporal/dynamic_config.yaml
    networks:
      - penfold-network
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.26
    ports:
      - "8088:8080"   # Web UI (8088 to avoid conflict with LLM on 8000)
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:8088
    depends_on:
      temporal:
        condition: service_healthy
    networks:
      - penfold-network

  temporal-admin-tools:
    image: temporalio/admin-tools:1.24
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      temporal:
        condition: service_healthy
    networks:
      - penfold-network
    profiles:
      - tools  # Only start with: docker-compose -f docker-compose.temporal.yml --profile tools up -d

networks:
  penfold-network:
    driver: bridge
